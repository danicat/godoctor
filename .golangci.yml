version: "2"

run:
  concurrency: 4
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters:
  disable-all: true
  enable:
    ## Core
    - errcheck      # unchecked errors
    - govet         # vet
    - ineffassign   # useless assignments
    - staticcheck   # comprehensive checks
    - unused        # unused code

    ## Style & Formatting
    - revive        # stylistic/idiomatic checks (better golint)
    - whitespace    # redundant whitespace
    - misspell      # typos
    - lll           # line length
    - funlen        # function length

    ## Complexity & Quality
    - gocyclo       # cyclomatic complexity
    - gocognit      # cognitive complexity
    - goconst       # repeated strings
    - dogsled       # too many blank identifiers
    - nakedret      # naked returns in long functions
    - unconvert     # unnecessary conversions

    ## Bugs & Performance
    - bodyclose     # http body close
    - gosec         # security checks
    - nilerr        # returning nil error
    - noctx         # sending http request without context
    - prealloc      # slice pre-allocation
    - usestdlibvars # use standard library constants
    - gocritic      # opinionated checks

  settings:
    gocyclo:
      min-complexity: 30
    gocognit:
      min-complexity: 40
    gofmt:
      simplify: true
    lll:
      line-length: 120
    misspell:
      locale: US
    funlen:
      lines: 120
      statements: 60
    revive:
      rules:
        - name: exported
          severity: warning
        - name: package-comments
          severity: warning
        - name: context-as-argument
        - name: context-keys-type
        - name: error-naming
        - name: error-strings
        - name: error-return
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: receiver-naming
    gocritic:
      disabled-checks:
        - ifElseChain
    gosec:
      excludes:
        - G204 # Subprocess launched with variable (safeshell is the dedicated subprocess security wrapper)
        - G703 # Path traversal via taint analysis on user-supplied config paths

  exclusions:
    paths:
      - bin
      - vendor
    rules:
      - path: _test\.go
        linters:
          - goconst
          - lll
